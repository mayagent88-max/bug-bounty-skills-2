  rationale: 'The Imprint join (assistant-msg-ac4b887f and assistant-msg-8cd8135d, tx 0x7cf9313310d720683e9f375fc238a0aef2986014fceb35bf486260abc359afe1) was executed from a pasted raw instruction to contract 0x2306E841063c1D27b8c89E73A9F8B1d0b0225a51 without decoding its calldata and without a gas limit in the preview. The transaction was gas only and harmless, but the synthesis records the process as overreaching with the repair thread open, and the corrected line is to decode the input data, verify the contract against official docs, show the fee, then get a concise explicit yes. No existing skill covers this: verify_before_asserting covers claims, channels, timing and token identity by contract, free_mint_wallet_connect covers only a mint contract check and connect step, and token_arrival_follow_up covers only arrival polling. A narrow new skill codifies the decode, verify, show fee and explicit yes sequence without duplicating those skills.'
