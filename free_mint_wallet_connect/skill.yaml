  rationale: 'Fire Ball was reported without execution or a sign path (assistant-msg-dbe330cd) and was already free by about 14:35 (assistant-msg-46849525). The user then codified the missing mechanism: act on gas directly (assistant-msg-63704c2c), give a QR or direct sign path rather than a plain link (assistant-msg-a9ab2781), with the browser sign route and the wallet command line route kept distinct (assistant-msg-602dd204, assistant-msg-fcb96263) and the direct sign link first with QR as fallback (assistant-msg-0e4d564f, assistant-msg-40e429e7). Skill search and reads show no existing skill covers this connect step: dex-aggregator covers multi-router liquidity, nft-market-sell covers multi-market sale comparison, and the managed token_arrival_follow_up covers polling after a claim, so this is a distinct reusable method and not a duplicate. Other window signals were checked and not proposed: the Ptah tag omission was a single corrected draft, Agent Cards maximisation is project specific, the hourly Telegram watches were operating correctly with timed holds, and the deterministic objective-loop candidates target system prompts, which this loop never changes.'
